<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Musa Blush · Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0c0c0e;
    --bg-soft: #141416;
    --card: #1a1a1d;
    --neon: #ff2ea6;
    --neon-soft: #ff8dc9;
    --mauve: #a85c66;
    --blush: #e8b8be;
    --white-ink: #f4eef0;
    --line: rgba(244,238,240,0.10);
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  body{
    background: var(--bg);
    color: var(--white-ink);
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    letter-spacing: 0.02em;
    -webkit-font-smoothing: antialiased;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  /* ---------- HERO / LOGO ---------- */
  .hero{
    min-height: 78vh;
    display:flex;
    flex-direction: column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 40px 24px 24px;
    position:relative;
    overflow:hidden;
    background:
      radial-gradient(ellipse 60% 45% at 50% 30%, rgba(255,46,166,0.18) 0%, transparent 70%),
      var(--bg);
  }

  .hero-eyebrow{
    font-family:'Jost',sans-serif;
    font-size: 11px;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--blush);
    opacity: 0.75;
    opacity: 0;
    animation: fadeUp 1s ease forwards 0.2s;
  }

  .logo-mark{
    width: min(78vw, 520px);
    margin: 10px auto 0;
    opacity: 0;
    transform: translateY(28px) scale(0.94);
    animation: logoReveal 1.1s cubic-bezier(.16,1,.3,1) forwards 0.35s,
               neonPulse 3.5s ease-in-out infinite 1.5s;
  }
  @media (max-width: 640px){
    .hero{ min-height: auto; padding: 32px 24px 8px; }
    .logo-mark{ width: 25vw; min-width: 100px; }
    .hero-sub{ margin-top: 14px; }
    .banner-wrap{ max-width: 58%; padding: 0 24px 40px; margin: 22px auto 0; }
  }
  .logo-mark img{
    width: 100%;
    display: block;
    filter: drop-shadow(0 0 22px rgba(214,37,155,0.45));
  }

  .hero-line{
    width: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--neon), transparent);
    margin: 22px auto 0;
    animation: growLine 0.9s ease forwards 1.15s;
  }

  .hero-sub{
    margin-top: 20px;
    font-size: 14px;
    letter-spacing: 0.06em;
    color: var(--blush);
    opacity: 0;
    animation: fadeUp 0.9s ease forwards 1.35s;
  }

  @keyframes logoReveal{
    to{ opacity:1; transform: translateY(0) scale(1); }
  }
  @keyframes neonPulse{
    0%, 100%{ filter: drop-shadow(0 0 22px rgba(214,37,155,0.45)); }
    50%{ filter: drop-shadow(0 0 34px rgba(214,37,155,0.7)); }
  }
  @keyframes fadeUp{
    from{ opacity:0; transform: translateY(12px); }
    to{ opacity:1; transform: translateY(0); }
  }
  @keyframes growLine{
    to{ width: 140px; }
  }

  /* ---------- BANNER ---------- */
  .banner-wrap{
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px 64px;
  }
  .banner{
    width: 100%;
    aspect-ratio: 1600 / 600;
    position: relative;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .banner img{
    width:100%; height:100%; object-fit:cover;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 12%, black 88%, transparent 100%),
                         linear-gradient(to right, transparent 0%, black 6%, black 94%, transparent 100%);
    -webkit-mask-composite: source-in;
    mask-image: linear-gradient(to bottom, transparent 0%, black 12%, black 88%, transparent 100%),
                linear-gradient(to right, transparent 0%, black 6%, black 94%, transparent 100%);
    mask-composite: intersect;
  }

  /* ---------- CATALOG / CAROUSEL ---------- */
  .catalog{
    max-width: 640px;
    margin: 0 auto;
    padding: 0 24px 120px;
  }

  .catalog-heading{
    text-align:center;
    margin-bottom: 44px;
  }
  .catalog-heading .eyebrow{
    font-size: 12px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--neon-soft);
    display:block;
    margin-bottom: 10px;
  }
  .catalog-heading h2{
    font-family: 'Pacifico', cursive;
    font-weight: 400;
    font-size: clamp(30px, 4.5vw, 46px);
    color: var(--white-ink);
  }

  /* Carousel */
  .carousel{
    position: relative;
    width: 100%;
    aspect-ratio: 3 / 4;
    border-radius: 6px;
    overflow: hidden;
    background: linear-gradient(160deg, var(--card) 0%, #241419 100%);
    border: 1px solid var(--line);
  }
  .carousel-track{
    position: absolute;
    inset: 0;
  }
  .carousel-slide{
    position: absolute;
    inset: 0;
    opacity: 0;
    transform: scale(1.03);
    transition: opacity 0.6s cubic-bezier(.22,.61,.36,1), transform 0.7s cubic-bezier(.22,.61,.36,1);
    pointer-events: none;
  }
  .carousel-slide.active{
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
  }
  .carousel-slide img{
    width:100%; height:100%; object-fit: cover; display:block;
  }

  .carousel-arrow{
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 40px; height: 40px;
    border-radius: 50%;
    background: rgba(12,12,14,0.55);
    border: 1px solid var(--line);
    backdrop-filter: blur(6px);
    display:flex; align-items:center; justify-content:center;
    color: var(--white-ink);
    cursor: pointer;
    transition: background 0.25s ease, border-color 0.25s ease, transform 0.2s ease;
    z-index: 2;
    font-size: 16px;
    user-select: none;
  }
  .carousel-arrow:hover{ background: rgba(255,46,166,0.25); border-color: var(--neon); transform: translateY(-50%) scale(1.06); }
  .carousel-arrow.prev{ left: 14px; }
  .carousel-arrow.next{ right: 14px; }

  .carousel-dots{
    display:flex;
    justify-content:center;
    gap: 6px;
    margin-top: 16px;
  }
  .dot{
    width: 6px; height: 6px;
    border-radius: 50%;
    background: rgba(244,238,240,0.25);
    transition: background 0.3s ease, transform 0.3s ease;
  }
  .dot.active{ background: var(--neon); transform: scale(1.3); }

  /* Model name above selector */
  .model-display{
    text-align:center;
    margin-top: 32px;
    font-family:'Jost', sans-serif;
    font-weight: 500;
    font-size: 20px;
    letter-spacing: 0.03em;
    transition: opacity 0.35s ease, transform 0.35s ease;
  }

  /* Model selector: horizontal scroll pills */
  .model-selector{
    display:flex;
    gap: 10px;
    overflow-x: auto;
    padding: 22px 2px 4px;
    scrollbar-width: none;
  }
  .model-selector::-webkit-scrollbar{ display:none; }

  .pill{
    flex: 0 0 auto;
    padding: 9px 18px;
    border-radius: 999px;
    border: 1px solid var(--line);
    font-size: 13px;
    letter-spacing: 0.03em;
    color: rgba(244,238,240,0.65);
    cursor: pointer;
    white-space: nowrap;
    transition: border-color 0.25s ease, color 0.25s ease, background 0.25s ease, transform 0.2s ease;
  }
  .pill:hover{ border-color: var(--neon-soft); color: var(--white-ink); }
  .pill.active{
    background: var(--neon);
    border-color: var(--neon);
    color: #0c0c0e;
    font-weight: 500;
    transform: scale(1.03);
  }

  .section-label{
    text-align:center;
    font-size: 11px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(244,238,240,0.4);
    margin-top: 36px;
    margin-bottom: 4px;
  }

  .colors{
    display:flex;
    gap: 10px;
    justify-content:center;
    flex-wrap: wrap;
    margin-top: 16px;
    margin-bottom: 16px;
  }

  .swatch{
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1px solid var(--line);
    cursor: pointer;
    position: relative;
    transition: transform 0.25s cubic-bezier(.22,.61,.36,1), box-shadow 0.25s ease;
  }
  .swatch:hover{ transform: scale(1.15); }
  .swatch.swatch-dark{
    border: 1px solid rgba(244,238,240,0.45);
  }
  .swatch.selected{
    box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--neon);
    transform: scale(1.12);
  }

  .selected-label{
    text-align:center;
    font-size: 12px;
    letter-spacing: 0.06em;
    color: rgba(244,238,240,0.5);
    min-height: 16px;
    margin-bottom: 28px;
    transition: opacity 0.3s ease;
  }

  .wa-btn-wrap{ text-align:center; }

  .wa-btn{
    display:inline-flex;
    align-items:center;
    gap: 8px;
    padding: 14px 38px;
    border: 1px solid var(--neon);
    border-radius: 999px;
    text-decoration:none;
    color: var(--white-ink);
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    transition: background 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
  }
  .wa-btn:hover{
    background: var(--neon);
    color: #0c0c0e;
    box-shadow: 0 0 24px rgba(255,46,166,0.5);
  }

  footer{
    text-align:center;
    padding: 40px 24px 50px;
    font-size: 12px;
    letter-spacing: 0.1em;
    color: rgba(244,238,240,0.4);
    border-top: 1px solid var(--line);
  }
</style>
</head>
<body>

  <section class="hero">
    <span class="hero-eyebrow">Lo que usás todos los días, en un solo lugar</span>
    <div class="logo-mark"><img src="images/musa_logo.png" alt="Musa Blush"></div>
    <div class="hero-line"></div>
    <p class="hero-sub">Envíos a todo Uruguay · Elegí tu modelo y tu color</p>
  </section>

  <div class="banner-wrap">
    <div class="banner">
      <img src="images/banner.png" alt="Musa Blush">
    </div>
  </div>

  <section class="catalog">
    <div class="catalog-heading">
      <span class="eyebrow">Catálogo</span>
      <h2>Fundas Musa</h2>
    </div>

    <div class="carousel" id="carousel">
      <div class="carousel-track" id="carouselTrack"></div>
      <div class="carousel-arrow prev" id="prevArrow">‹</div>
      <div class="carousel-arrow next" id="nextArrow">›</div>
    </div>
    <div class="carousel-dots" id="carouselDots"></div>

    <div class="model-display" id="modelDisplay"></div>

    <div class="section-label">Modelo</div>
    <div class="model-selector" id="modelSelector"></div>

    <div class="section-label">Color</div>
    <div class="colors" id="colorSelector"></div>
    <div class="selected-label" id="selectedLabel"></div>

    <div class="wa-btn-wrap">
      <a class="wa-btn" id="waBtn" target="_blank" rel="noopener">Consultar por WhatsApp</a>
    </div>
  </section>

  <footer>Musa Blush © 2026 · Hecho con cariño</footer>

<script>
const WHATSAPP_NUMBER = "59891443989"; // 091 443 989

const models = [
  { name: "iPhone 11" },
  { name: "iPhone 12 / 12 Pro" },
  { name: "iPhone 12 Pro Max" },
  { name: "iPhone 13 / 14" },
  { name: "iPhone 13 Pro" },
  { name: "iPhone 13 Pro Max" },
  { name: "iPhone 14 Pro" },
  { name: "iPhone 14 Pro Max" },
  { name: "iPhone 15" },
  { name: "iPhone 15 Pro" },
  { name: "iPhone 15 Pro Max" },
  { name: "iPhone 16" },
  { name: "iPhone 16 Pro" },
  { name: "iPhone 16 Pro Max" },
  { name: "iPhone 17" },
  { name: "iPhone 17 Pro", extraColors: [{ name: "Negro", hex: "#111111" }] },
  { name: "iPhone 17 Pro Max" }
];

const colors = [
  { name: "Turquesa", hex: "#2bab9a" },
  { name: "Rojo", hex: "#e0453a" },
  { name: "Durazno", hex: "#f4ac82" },
  { name: "Fucsia", hex: "#d6259b" },
  { name: "Rosa viejo", hex: "#c98a9a" },
  { name: "Chocolate", hex: "#6b4226" },
  { name: "Rosa claro", hex: "#f4c6d2" },
  { name: "Púrpura", hex: "#8b4fc4" },
  { name: "Frutilla", hex: "#d81a5f" },
  { name: "Gris", hex: "#a3a3a3" }
];

// Fotos del carrusel (mismas para todos los modelos por ahora, prueba)
// TODO: reemplazar por fotos reales — se puede armar un set distinto por modelo si hace falta
const carouselPhotos = [
  'images/case1.jpg',
  'images/case2.jpg',
  'images/case3.jpg'
];

function isDark(hex){
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  const luminance = (0.299*r + 0.587*g + 0.114*b) / 255;
  return luminance < 0.25;
}

// ---------- State ----------
let currentModelIndex = 0;
let currentColor = colors[0].name;
let currentSlide = 0;
let autoplayTimer = null;

// ---------- Carousel ----------
const track = document.getElementById('carouselTrack');
const dotsWrap = document.getElementById('carouselDots');

carouselPhotos.forEach((src, i) => {
  const slide = document.createElement('div');
  slide.className = 'carousel-slide' + (i === 0 ? ' active' : '');
  const img = document.createElement('img');
  img.src = src;
  img.alt = 'Musa Blush';
  slide.appendChild(img);
  track.appendChild(slide);

  const dot = document.createElement('div');
  dot.className = 'dot' + (i === 0 ? ' active' : '');
  dot.addEventListener('click', () => goToSlide(i));
  dotsWrap.appendChild(dot);
});

function goToSlide(i){
  const slides = track.querySelectorAll('.carousel-slide');
  const dots = dotsWrap.querySelectorAll('.dot');
  slides[currentSlide].classList.remove('active');
  dots[currentSlide].classList.remove('active');
  currentSlide = (i + carouselPhotos.length) % carouselPhotos.length;
  slides[currentSlide].classList.add('active');
  dots[currentSlide].classList.add('active');
  resetAutoplay();
}

document.getElementById('prevArrow').addEventListener('click', () => goToSlide(currentSlide - 1));
document.getElementById('nextArrow').addEventListener('click', () => goToSlide(currentSlide + 1));

function resetAutoplay(){
  clearInterval(autoplayTimer);
  autoplayTimer = setInterval(() => goToSlide(currentSlide + 1), 4500);
}
resetAutoplay();

// Swipe support (mobile)
let touchStartX = 0;
const carouselEl = document.getElementById('carousel');
carouselEl.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
carouselEl.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 40) goToSlide(currentSlide + (dx < 0 ? 1 : -1));
}, { passive: true });

// ---------- Model selector ----------
const modelSelector = document.getElementById('modelSelector');
const modelDisplay = document.getElementById('modelDisplay');

models.forEach((m, i) => {
  const pill = document.createElement('div');
  pill.className = 'pill' + (i === 0 ? ' active' : '');
  pill.textContent = m.name;
  pill.addEventListener('click', () => selectModel(i));
  modelSelector.appendChild(pill);
});

function selectModel(i){
  currentModelIndex = i;
  modelSelector.querySelectorAll('.pill').forEach((p, idx) => p.classList.toggle('active', idx === i));

  modelDisplay.style.opacity = 0;
  modelDisplay.style.transform = 'translateY(6px)';
  setTimeout(() => {
    modelDisplay.textContent = models[i].name;
    modelDisplay.style.opacity = 1;
    modelDisplay.style.transform = 'translateY(0)';
  }, 180);

  renderColors();
}

// scroll active pill into view
function scrollPillIntoView(){
  const active = modelSelector.querySelector('.pill.active');
  if (active) active.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
}

// ---------- Color selector ----------
const colorSelector = document.getElementById('colorSelector');
const selectedLabel = document.getElementById('selectedLabel');
const waBtn = document.getElementById('waBtn');

function renderColors(){
  const modelObj = models[currentModelIndex];
  const modelColors = modelObj.extraColors ? colors.concat(modelObj.extraColors) : colors;

  colorSelector.innerHTML = '';
  currentColor = modelColors[0].name;

  modelColors.forEach((c, i) => {
    const sw = document.createElement('div');
    sw.className = 'swatch' + (i === 0 ? ' selected' : '');
    sw.style.background = c.hex;
    sw.title = c.name;
    if (isDark(c.hex)) sw.classList.add('swatch-dark');
    sw.addEventListener('click', () => {
      colorSelector.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
      sw.classList.add('selected');
      currentColor = c.name;
      updateLabelAndLink();
    });
    colorSelector.appendChild(sw);
  });

  updateLabelAndLink();
}

function updateLabelAndLink(){
  selectedLabel.style.opacity = 0;
  setTimeout(() => {
    selectedLabel.textContent = currentColor;
    selectedLabel.style.opacity = 1;
  }, 150);

  const model = models[currentModelIndex].name;
  const msg = `Hola! Quiero consultar por la funda ${model} en color ${currentColor}.`;
  waBtn.href = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
}

// ---------- Init ----------
modelDisplay.textContent = models[0].name;
renderColors();
</script>

</body>
</html>
