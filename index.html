<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Musa Blush · Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0c0c0e;
    --bg-soft: #141416;
    --card: #1a1a1d;
    --neon: #ff2ea6;
    --neon-soft: #ff8dc9;
    --mauve: #a85c66;
    --blush: #e8b8be;
    --white-ink: #f4eef0;
    --line: rgba(244,238,240,0.10);
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  body{
    background: var(--bg);
    color: var(--white-ink);
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    letter-spacing: 0.02em;
    -webkit-font-smoothing: antialiased;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; transition-duration: 0.001ms !important; }
  }

  /* ---------- HERO / LOGO ---------- */
  .hero{
    min-height: 78vh;
    display:flex;
    flex-direction: column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding: 40px 24px 24px;
    position:relative;
    overflow:hidden;
    background:
      radial-gradient(ellipse 60% 45% at 50% 30%, rgba(255,46,166,0.18) 0%, transparent 70%),
      var(--bg);
  }

  .hero-eyebrow{
    font-family:'Jost',sans-serif;
    font-size: 11px;
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: var(--blush);
    opacity: 0.75;
    opacity: 0;
    animation: fadeUp 1s ease forwards 0.2s;
  }

  .logo-mark{
    width: min(78vw, 520px);
    margin: 10px auto 0;
    opacity: 0;
    transform: translateY(28px) scale(0.94);
    animation: logoReveal 1.1s cubic-bezier(.16,1,.3,1) forwards 0.35s,
               neonPulse 3.5s ease-in-out infinite 1.5s;
  }
  .logo-mark img{
    width: 100%;
    display: block;
    mix-blend-mode: screen;
    filter: drop-shadow(0 0 22px rgba(214,37,155,0.45));
  }

  .hero-line{
    width: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--neon), transparent);
    margin: 22px auto 0;
    animation: growLine 0.9s ease forwards 1.15s;
  }

  .hero-sub{
    margin-top: 20px;
    font-size: 14px;
    letter-spacing: 0.06em;
    color: var(--blush);
    opacity: 0;
    animation: fadeUp 0.9s ease forwards 1.35s;
  }

  @keyframes logoReveal{
    to{ opacity:1; transform: translateY(0) scale(1); }
  }
  @keyframes neonPulse{
    0%, 100%{ filter: drop-shadow(0 0 22px rgba(214,37,155,0.45)); }
    50%{ filter: drop-shadow(0 0 34px rgba(214,37,155,0.7)); }
  }
  @keyframes fadeUp{
    from{ opacity:0; transform: translateY(12px); }
    to{ opacity:1; transform: translateY(0); }
  }
  @keyframes growLine{
    to{ width: 140px; }
  }

  /* ---------- BANNER ---------- */
  .banner-wrap{
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px 64px;
  }
  .banner{
    width: 100%;
    aspect-ratio: 1600 / 600;
    position: relative;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .banner img{
    width:100%; height:100%; object-fit:cover;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 12%, black 88%, transparent 100%),
                         linear-gradient(to right, transparent 0%, black 6%, black 94%, transparent 100%);
    -webkit-mask-composite: source-in;
    mask-image: linear-gradient(to bottom, transparent 0%, black 12%, black 88%, transparent 100%),
                linear-gradient(to right, transparent 0%, black 6%, black 94%, transparent 100%);
    mask-composite: intersect;
  }

  /* ---------- CATALOG ---------- */
  .catalog{
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px 100px;
  }

  .catalog-heading{
    text-align:center;
    margin-bottom: 56px;
  }
  .catalog-heading .eyebrow{
    font-size: 12px;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--neon-soft);
    display:block;
    margin-bottom: 10px;
  }
  .catalog-heading h2{
    font-family: 'Pacifico', cursive;
    font-weight: 400;
    font-size: clamp(30px, 4.5vw, 46px);
    color: var(--white-ink);
  }

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 36px 28px;
  }

  .card{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  .card-photo{
    width:100%;
    aspect-ratio: 3 / 4;
    background: linear-gradient(160deg, var(--card) 0%, #241419 100%);
    border: 1px solid var(--line);
    border-radius: 3px;
    display:flex;
    align-items:center;
    justify-content:center;
    color: rgba(244,238,240,0.35);
    font-size: 12px;
    letter-spacing: 0.06em;
    overflow:hidden;
    margin-bottom: 18px;
    transition: transform 0.5s cubic-bezier(.16,1,.3,1), border-color 0.3s ease;
  }
  .card-photo img{ width:100%; height:100%; object-fit:cover; display:none; }
  .card:hover .card-photo{ transform: translateY(-4px); border-color: var(--neon); }

  .card h3{
    font-family:'Jost', sans-serif;
    font-weight: 500;
    font-size: 15px;
    letter-spacing: 0.04em;
    margin-bottom: 12px;
  }

  .colors{
    display:flex;
    gap: 8px;
    justify-content:center;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  .swatch{
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1px solid var(--line);
    cursor: pointer;
    position: relative;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .swatch:hover{ transform: scale(1.15); }
  .swatch.swatch-dark{
    border: 1px solid rgba(244,238,240,0.45);
  }
  .swatch.selected{
    box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--neon);
  }

  .selected-label{
    font-size: 11px;
    letter-spacing: 0.06em;
    color: rgba(244,238,240,0.5);
    min-height: 14px;
    margin-bottom: 14px;
  }

  .wa-btn{
    display:inline-flex;
    align-items:center;
    gap: 8px;
    padding: 11px 26px;
    border: 1px solid var(--neon);
    border-radius: 999px;
    text-decoration:none;
    color: var(--white-ink);
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    transition: background 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
  }
  .wa-btn:hover{
    background: var(--neon);
    color: #0c0c0e;
    box-shadow: 0 0 20px rgba(255,46,166,0.5);
  }

  footer{
    text-align:center;
    padding: 40px 24px 50px;
    font-size: 12px;
    letter-spacing: 0.1em;
    color: rgba(244,238,240,0.4);
    border-top: 1px solid var(--line);
  }
</style>
</head>
<body>

  <section class="hero">
    <span class="hero-eyebrow">Lo que usás todos los días, en un solo lugar</span>
    <div class="logo-mark"><img src="images/musa_logo.png" alt="Musa Blush"></div>
    <div class="hero-line"></div>
    <p class="hero-sub">Envíos a todo Uruguay · Elegí tu modelo y tu color</p>
  </section>

  <div class="banner-wrap">
    <div class="banner">
      <img src="images/banner.png" alt="Musa Blush">
    </div>
  </div>

  <section class="catalog">
    <div class="catalog-heading">
      <span class="eyebrow">Catálogo</span>
      <h2>Fundas por modelo</h2>
    </div>

    <div class="grid" id="grid"></div>
  </section>

  <footer>Musa Blush © 2026 · Hecho con cariño</footer>

<script>
const WHATSAPP_NUMBER = "59800000000"; // TODO: reemplazar por el número real (código país + número, sin +)

const models = [
  { name: "iPhone 11" },
  { name: "iPhone 12 / 12 Pro" },
  { name: "iPhone 12 Pro Max" },
  { name: "iPhone 13 / 14" },
  { name: "iPhone 13 Pro" },
  { name: "iPhone 13 Pro Max" },
  { name: "iPhone 14 Pro" },
  { name: "iPhone 14 Pro Max" },
  { name: "iPhone 15" },
  { name: "iPhone 15 Pro" },
  { name: "iPhone 15 Pro Max" },
  { name: "iPhone 16" },
  { name: "iPhone 16 Pro" },
  { name: "iPhone 16 Pro Max" },
  { name: "iPhone 17" },
  { name: "iPhone 17 Pro", extraColors: [{ name: "Negro", hex: "#111111" }] },
  { name: "iPhone 17 Pro Max" }
];

const colors = [
  { name: "Turquesa", hex: "#2bab9a" },
  { name: "Rojo", hex: "#e0453a" },
  { name: "Durazno", hex: "#f4ac82" },
  { name: "Fucsia", hex: "#d6259b" },
  { name: "Rosa viejo", hex: "#c98a9a" },
  { name: "Chocolate", hex: "#6b4226" },
  { name: "Rosa claro", hex: "#f4c6d2" },
  { name: "Púrpura", hex: "#8b4fc4" },
  { name: "Frutilla", hex: "#d81a5f" },
  { name: "Gris", hex: "#a3a3a3" }
];

const grid = document.getElementById('grid');

function isDark(hex){
  const r = parseInt(hex.slice(1,3), 16);
  const g = parseInt(hex.slice(3,5), 16);
  const b = parseInt(hex.slice(5,7), 16);
  const luminance = (0.299*r + 0.587*g + 0.114*b) / 255;
  return luminance < 0.25;
}

models.forEach(modelObj => {
  const model = modelObj.name;
  const modelColors = modelObj.extraColors ? colors.concat(modelObj.extraColors) : colors;

  const card = document.createElement('div');
  card.className = 'card';

  const photo = document.createElement('div');
  photo.className = 'card-photo';
  photo.textContent = model; // TODO: reemplazar por <img src="images/modelo.jpg">
  card.appendChild(photo);

  const h3 = document.createElement('h3');
  h3.textContent = model;
  card.appendChild(h3);

  const colorsWrap = document.createElement('div');
  colorsWrap.className = 'colors';

  const label = document.createElement('div');
  label.className = 'selected-label';

  let selectedColor = modelColors[0].name;
  label.textContent = selectedColor;

  modelColors.forEach((c, i) => {
    const sw = document.createElement('div');
    sw.className = 'swatch' + (i === 0 ? ' selected' : '');
    sw.style.background = c.hex;
    sw.title = c.name;
    if (isDark(c.hex)) sw.classList.add('swatch-dark');
    sw.addEventListener('click', () => {
      colorsWrap.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
      sw.classList.add('selected');
      selectedColor = c.name;
      label.textContent = selectedColor;
      waBtn.href = buildLink(model, selectedColor);
    });
    colorsWrap.appendChild(sw);
  });

  card.appendChild(colorsWrap);
  card.appendChild(label);

  function buildLink(model, color){
    const msg = `Hola! Quiero consultar por la funda ${model} en color ${color}.`;
    return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
  }

  const waBtn = document.createElement('a');
  waBtn.className = 'wa-btn';
  waBtn.target = '_blank';
  waBtn.rel = 'noopener';
  waBtn.href = buildLink(model, selectedColor);
  waBtn.textContent = 'Consultar';
  card.appendChild(waBtn);

  grid.appendChild(card);
});
</script>

</body>
</html>
